[tool.briefcase]
project_name = "Osaeru"
bundle = "com.yourname"
version = "0.1.0"
url = "https://example.com"
license.file = "LICENSE"
author = "Aniruddha Sengupta"
author_email = "zenzosan@gmail.com"

[tool.briefcase.app.osaeru]
formal_name = "Osaeru"
description = "Personal AI-assisted jiu jitsu coach"
sources = ["src/osaeru"]
requires = [
    "toga>=0.4.0",
    "anthropic",
    "keyring",
]
test_sources = ["tests"]
test_requires = ["pytest"]

[tool.briefcase.app.osaeru.macOS]
requires = [
    "toga-cocoa>=0.4.0",
]

[tool.briefcase.app.osaeru.linux]
requires = [
    "toga-gtk>=0.4.0",
]

[tool.briefcase.app.osaeru.windows]
requires = [
    "toga-winforms>=0.4.0",
]

[tool.briefcase.app.osaeru.iOS]
requires = [
    "toga-iOS>=0.4.0",
    "std-nslog>=1.0.0",
]

# NOTE: local notification scheduling APIs on iOS/Toga move between
# Briefcase/Toga releases. Before wiring notifications.py up for real,
# check the current Toga docs for the notification backend on iOS -
# this scaffold leaves it as a clearly-marked stub.