[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osaeru"
version = "0.2.0"
description = "Personal AI-assisted jiu jitsu coach"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aniruddha Sengupta", email = "zenzosan@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.40.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27"]

[project.scripts]
osaeru = "osaeru.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osaeru"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
